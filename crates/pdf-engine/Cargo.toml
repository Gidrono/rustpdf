[package]
name = "doxo-pdf-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PDFium-backed render worker, tile/thumbnail caches (Phase 1)"

[features]
default = ["pdfium"]
# Real PDFium rendering via pdfium-render. Disable for UI-only mock builds:
#   cargo run -p doxo-app --no-default-features
pdfium = ["dep:pdfium-render"]

[dependencies]
doxo-document = { workspace = true }
doxo-pdf-lowlevel = { workspace = true }
crossbeam-channel = { workspace = true }
image = { workspace = true }
blake3 = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
pdfium-render = { workspace = true, optional = true }
